name: wedding-planner
on:
  push:
    paths: ["wedding-planner/**", ".github/workflows/wedding-planner.yml"]
  pull_request:
    paths: ["wedding-planner/**", ".github/workflows/wedding-planner.yml"]
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: wedding-planner } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_USER: atelier_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atelier_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://atelier_test:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: wedding-planner/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
